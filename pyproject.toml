[project]
name = "sourcerer"
version = "0.1.0"
description = "Evidence-grounded technical sourcing from public GitHub data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["github", "recruiting", "sourcing", "llm", "grounding"]
dependencies = [
  "pydantic>=2.7,<3", "httpx>=0.27,<1", "selectolax>=0.3,<1",
  "litellm>=1.50,<2", "python-dotenv>=1.0,<2",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23,<2", "pytest-cov>=5,<8", "ruff>=0.6,<1"]
[project.scripts]
sourcerer = "sourcerer.cli:main"
sourcerer-eval = "sourcerer.evals.run:main"
[project.urls]
Repository = "https://github.com/Dr-Inker/sourcerer"
Demo = "https://drinkerlabs.info/sourcerer/"
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
