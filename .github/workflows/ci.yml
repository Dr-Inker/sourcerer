name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (editable, with dev deps)
        run: pip install -e ".[dev]"

      - name: Run tests (network-free)
        run: pytest --cov=sourcerer --cov-report=term-missing --cov-fail-under=80 -q

      - name: Lint
        run: ruff check src tests

      - name: Retrieval quality gate
        run: python -m sourcerer.evals.run --min-mrr 0.8
